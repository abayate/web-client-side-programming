<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labyrinth Escape - Anthony Bayate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;800&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 20%, #2b1d0e, #0d0805 75%); color: #f4e4c1; font-family: 'Cinzel', serif;
  }
  h1 { margin: 8px 0 4px; letter-spacing: 6px; color: #ffcf6b; text-shadow: 0 0 14px #ff8a00; }
  #hud { display: flex; gap: 22px; margin: 6px 0 10px; font-size: 18px; flex-wrap: wrap; justify-content: center; }
  #hud span b { color: #ffcf6b; }
  canvas { border: 4px solid #6b4a1e; border-radius: 6px; box-shadow: 0 0 30px rgba(255,140,0,.35); background: #120c06; max-width: 96vw; }
  #msg { height: 24px; margin-top: 8px; color: #8ff0b0; }
  .credit { font-size: 12px; margin: 6px; color: #b89a6a; }
  button { font-family: inherit; padding: 8px 18px; font-size: 16px; background: #ffcf6b; border: 0; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<h1>LABYRINTH ESCAPE</h1>
<div id="hud">
  <span>Level <b id="lvl">1</b></span>
  <span>Coins left <b id="coins">0</b></span>
  <span>Time <b id="time">0</b>s</span>
  <span>Score <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
</div>
<canvas id="c"></canvas>
<div id="msg"></div>
<div class="credit">Arrows / WASD to move · Collect every coin to unlock the exit · Avoid guards · Built by Anthony Bayate · Kean University</div>
<button id="restart">New Game</button>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const TILE = 28;

// ---------- State ----------
let N, grid, W, H, player, start, exit, coins, guards, pickups, timeLeft, level, score, state, lastTick, moveCD, msgTimer, keys = {};
let best = +localStorage.getItem('labyrinthBest') || 0;
$('best').textContent = best;

// ---------- Maze generation (recursive backtracker on a tile grid) ----------
function makeMaze(n) {
  W = H = n * 2 + 1;
  grid = Array.from({ length: H }, () => Array(W).fill(1));
  const stack = [[1, 1]]; grid[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(() => Math.random() - .5)
      .filter(([dx, dy]) => x + dx > 0 && x + dx < W - 1 && y + dy > 0 && y + dy < H - 1 && grid[y + dy][x + dx] === 1);
    if (!dirs.length) { stack.pop(); continue; }
    const [dx, dy] = dirs[0];
    grid[y + dy / 2][x + dx / 2] = 0; grid[y + dy][x + dx] = 0;
    stack.push([x + dx, y + dy]);
  }
  // knock out a few walls so there are loops (guards need straight lanes)
  for (let i = 0; i < n * 2; i++) {
    const x = 1 + Math.floor(Math.random() * (W - 2)), y = 1 + Math.floor(Math.random() * (H - 2));
    if (grid[y][x] === 1 && ((grid[y][x - 1] === 0 && grid[y][x + 1] === 0) || (grid[y - 1][x] === 0 && grid[y + 1][x] === 0))) grid[y][x] = 0;
  }
}
const openCells = () => { const o = []; for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (!grid[y][x]) o.push([x, y]); return o; };

function randomOpen(taken, minDist = 0) {
  const cells = openCells().sort(() => Math.random() - .5);
  return cells.find(([x, y]) => !taken.some(t => t.x === x && t.y === y) && Math.hypot(x - start.x, y - start.y) >= minDist);
}

// ---------- Level setup ----------
function setupLevel() {
  N = Math.min(6 + level * 2, 16);
  makeMaze(N);
  canvas.width = W * TILE; canvas.height = H * TILE;
  start = { x: 1, y: 1 }; exit = { x: W - 2, y: H - 2 };
  player = { x: 1, y: 1 };

  // Task 5a: coins scattered in the maze paths
  const taken = [start, exit];
  coins = [];
  const nCoins = 5 + level * 2;
  for (let i = 0; i < nCoins; i++) { const c = randomOpen(taken, 3); if (c) { coins.push({ x: c[0], y: c[1] }); taken.push({ x: c[0], y: c[1] }); } }

  // Task 6c: power-ups (time boost, speed boost, guard freeze)
  pickups = [];
  const kinds = ['time', 'time', 'freeze', 'speed'];
  for (const k of kinds.slice(0, 2 + Math.min(level, 2))) {
    const c = randomOpen(taken, 3); if (c) { pickups.push({ x: c[0], y: c[1], kind: k }); taken.push({ x: c[0], y: c[1] }); }
  }

  // Task 5b: guards patrol straight lanes (horizontal or vertical)
  guards = [];
  const lanes = findLanes();
  const nGuards = Math.min(1 + level, 6);
  lanes.sort(() => Math.random() - .5);
  for (const lane of lanes) {
    if (guards.length >= nGuards) break;
    // keep guards away from the start area
    if (Math.hypot(lane.x1 - start.x, lane.y1 - start.y) < 5 && Math.hypot(lane.x2 - start.x, lane.y2 - start.y) < 5) continue;
    guards.push({ ...lane, t: Math.random(), dir: 1, speed: 2.2 + level * 0.3 });
  }
  timeLeft = Math.max(50, 100 + N * 3 - level * 6);
  frozen = 0; boosted = 0; lastTick = performance.now(); moveCD = 0;
}
let frozen = 0, boosted = 0;

function findLanes() {
  const lanes = [];
  for (let y = 1; y < H - 1; y++) {
    let x = 1;
    while (x < W - 1) {
      if (!grid[y][x]) { let e = x; while (e + 1 < W - 1 && !grid[y][e + 1]) e++; if (e - x >= 3) lanes.push({ x1: x, y1: y, x2: e, y2: y }); x = e + 1; } else x++;
    }
  }
  for (let x = 1; x < W - 1; x++) {
    let y = 1;
    while (y < H - 1) {
      if (!grid[y][x]) { let e = y; while (e + 1 < H - 1 && !grid[e + 1][x]) e++; if (e - y >= 3) lanes.push({ x1: x, y1: y, x2: x, y2: e }); y = e + 1; } else y++;
    }
  }
  return lanes;
}
const guardPos = g => ({ x: g.x1 + (g.x2 - g.x1) * g.t, y: g.y1 + (g.y2 - g.y1) * g.t });

function newGame() { level = 1; score = 0; state = 'play'; setupLevel(); say('Collect all coins, then reach the exit!'); }

// ---------- Messages ----------
function say(t, ms = 2500) { $('msg').textContent = t; clearTimeout(msgTimer); msgTimer = setTimeout(() => $('msg').textContent = '', ms); }

// ---------- Update ----------
function tryMove(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  if (grid[ny]?.[nx] === 0) {
    player.x = nx; player.y = ny;
    const ci = coins.findIndex(c => c.x === nx && c.y === ny);
    if (ci >= 0) { coins.splice(ci, 1); score += 10; if (!coins.length) say('All coins collected — the exit is open!'); }
    const pi = pickups.findIndex(p => p.x === nx && p.y === ny);
    if (pi >= 0) {
      const p = pickups.splice(pi, 1)[0];
      if (p.kind === 'time') { timeLeft += 30; say('+30 seconds!'); }
      if (p.kind === 'freeze') { frozen = 5; say('Guards frozen for 5 seconds!'); }
      if (p.kind === 'speed') { boosted = 8; say('Speed boost!'); }
    }
    if (nx === exit.x && ny === exit.y) {
      if (!coins.length) { score += 50 + Math.floor(timeLeft); level++; setupLevel(); say(`Level ${level}! Guards are faster.`); }
      else say(`The exit is sealed — ${coins.length} coin(s) left.`);
    }
  }
}
function update(dt) {
  if (state !== 'play') return;
  timeLeft -= dt; if (frozen > 0) frozen -= dt; if (boosted > 0) boosted -= dt;
  if (timeLeft <= 0) return lose("Time's up!");

  moveCD -= dt;
  if (moveCD <= 0) {
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.a) dx = -1; else if (keys.ArrowRight || keys.d) dx = 1;
    else if (keys.ArrowUp || keys.w) dy = -1; else if (keys.ArrowDown || keys.s) dy = 1;
    if (dx || dy) { tryMove(dx, dy); moveCD = boosted > 0 ? .06 : .12; }
  }

  if (frozen <= 0) guards.forEach(g => {
    const len = Math.max(Math.abs(g.x2 - g.x1), Math.abs(g.y2 - g.y1));
    g.t += g.dir * g.speed * dt / len;
    if (g.t >= 1) { g.t = 1; g.dir = -1; } if (g.t <= 0) { g.t = 0; g.dir = 1; }
  });
  // Task 5b: touching a guard sends the player back to the start
  for (const g of guards) {
    const p = guardPos(g);
    if (Math.hypot(p.x - player.x, p.y - player.y) < .75) {
      player.x = start.x; player.y = start.y; score = Math.max(0, score - 5); timeLeft -= 5;
      say('Caught by a guard! Back to the start (−5s).'); break;
    }
  }
}
function lose(m) {
  state = 'over'; if (score > best) { best = score; localStorage.setItem('labyrinthBest', best); }
  say(`${m} Final score ${score}. Press New Game.`, 60000);
}

// ---------- Draw ----------
function draw() {
  ctx.fillStyle = '#120c06'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (grid[y][x]) {
      ctx.fillStyle = (x + y) % 2 ? '#4a3318' : '#533a1b'; ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      ctx.strokeStyle = '#2d1e0c'; ctx.strokeRect(x * TILE + .5, y * TILE + .5, TILE - 1, TILE - 1);
    } else { ctx.fillStyle = '#d9c291'; ctx.globalAlpha = .08; ctx.fillRect(x * TILE, y * TILE, TILE, TILE); ctx.globalAlpha = 1; }
  }
  const cx = (x) => x * TILE + TILE / 2;
  // start & exit
  ctx.fillStyle = 'rgba(80,160,255,.35)'; ctx.fillRect(start.x * TILE, start.y * TILE, TILE, TILE);
  const open = coins.length === 0;
  ctx.fillStyle = open ? '#3dff8b' : '#7a2a2a'; ctx.shadowColor = open ? '#3dff8b' : '#000'; ctx.shadowBlur = open ? 18 : 0;
  ctx.fillRect(exit.x * TILE + 3, exit.y * TILE + 3, TILE - 6, TILE - 6); ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.font = 'bold 12px Cinzel'; ctx.textAlign = 'center'; ctx.fillText(open ? 'EXIT' : '🔒', cx(exit.x), exit.y * TILE + 19);
  // coins
  const pulse = 1 + Math.sin(performance.now() / 200) * .15;
  coins.forEach(c => { ctx.fillStyle = '#ffd400'; ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(cx(c.x), cx(c.y), 6 * pulse, 0, 7); ctx.fill(); ctx.shadowBlur = 0; });
  // pickups
  const PC = { time: ['#4dc3ff', '⏱'], freeze: ['#b8f1ff', '❄'], speed: ['#ff9f4d', '⚡'] };
  pickups.forEach(p => {
    ctx.fillStyle = PC[p.kind][0]; ctx.shadowColor = PC[p.kind][0]; ctx.shadowBlur = 10;
    ctx.fillRect(p.x * TILE + 5, p.y * TILE + 5, TILE - 10, TILE - 10); ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.font = '12px sans-serif'; ctx.fillText(PC[p.kind][1], cx(p.x), p.y * TILE + 19);
  });
  // guards
  guards.forEach(g => {
    const p = guardPos(g);
    ctx.fillStyle = frozen > 0 ? '#9ad8ff' : '#e0302e'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(cx(p.x), cx(p.y), TILE * .36, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.fillRect(cx(p.x) - 6, cx(p.y) - 4, 4, 4); ctx.fillRect(cx(p.x) + 2, cx(p.y) - 4, 4, 4);
  });
  // player
  ctx.fillStyle = boosted > 0 ? '#ff9f4d' : '#3d9bff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(cx(player.x), cx(player.y), TILE * .35, 0, 7); ctx.fill(); ctx.shadowBlur = 0;

  $('lvl').textContent = level; $('coins').textContent = coins.length; $('time').textContent = Math.max(0, Math.ceil(timeLeft));
  $('score').textContent = score; $('best').textContent = best;
}

function loop(now) {
  const dt = Math.min(.1, (now - lastTick) / 1000); lastTick = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });
$('restart').addEventListener('click', () => { newGame(); $('restart').blur(); });

newGame();
requestAnimationFrame(t => { lastTick = t; loop(t); });
</script>
</body>
</html>
