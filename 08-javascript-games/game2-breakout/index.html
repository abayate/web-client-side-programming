<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthwave Breakout - Anthony Bayate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: linear-gradient(180deg, #12002b 0%, #2a0a4a 55%, #ff4d8d 140%);
    font-family: 'Press Start 2P', monospace; color: #fff;
  }
  h1 { font-size: 20px; color: #ffe14d; text-shadow: 3px 3px 0 #ff2e93, 6px 6px 0 #4d00ff; margin: 12px 0; }
  canvas { background: #0b0220; border: 4px solid #ff2e93; box-shadow: 0 0 30px #ff2e93, inset 0 0 30px #4d00ff55; max-width: 96vw; }
  .credit { font-size: 9px; margin: 10px; color: #7df9ff; }
</style>
</head>
<body>
<h1>SYNTHWAVE BREAKOUT</h1>
<canvas id="c" width="720" height="540"></canvas>
<div class="credit">Made by Anthony Bayate · Kean University · ← → or mouse to move · P = pause · Space = launch</div>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Config ----------
const COLS = 10, ROWS = 6, BW = 64, BH = 22, BGAP = 6;
const OFFX = (W - (COLS * (BW + BGAP) - BGAP)) / 2, OFFY = 60;
const ROW_COLORS = ['#ff2e93', '#ff6b35', '#ffe14d', '#3dff8b', '#00d9ff', '#9d4dff'];
const BASE_PADDLE = 110, BASE_SPEED = 5.2;
const LB_KEY = 'synthBreakoutTop5';

// ---------- State ----------
let state = 'start'; // start | play | paused | over | initials
let score, lives, level, bricks, paddle, ball, drops, effects, particles, initials, keys = {};

// ---------- Leaderboard (Task 4c) ----------
const loadLB = () => { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; } };
function qualifies(s) { const lb = loadLB(); return s > 0 && (lb.length < 5 || s > lb[lb.length - 1].score); }
function addLB(name, s) {
  const lb = loadLB(); lb.push({ name, score: s });
  lb.sort((a, b) => b.score - a.score);
  localStorage.setItem(LB_KEY, JSON.stringify(lb.slice(0, 5)));
}

// ---------- Setup ----------
function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    // higher levels: some bricks need 2 hits
    const hp = (level > 1 && r < Math.min(level - 1, 3)) ? 2 : 1;
    bricks.push({ x: OFFX + c * (BW + BGAP), y: OFFY + r * (BH + BGAP), w: BW, h: BH, hp, color: ROW_COLORS[r] });
  }
}
function resetBall(stuck = true) {
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 9, r: 8, vx: 0, vy: 0, stuck, speed: BASE_SPEED + (level - 1) * .5 };
}
function newGame() {
  score = 0; lives = 3; level = 1; drops = []; effects = { wide: 0, slow: 0, sticky: 0 }; particles = [];
  paddle = { w: BASE_PADDLE, h: 14, x: W / 2 - BASE_PADDLE / 2, y: H - 36 };
  buildBricks(); resetBall(); state = 'play';
}
function launch() {
  if (!ball.stuck) return;
  const a = -Math.PI / 2 + (Math.random() * .6 - .3);
  ball.vx = Math.cos(a) * ball.speed; ball.vy = Math.sin(a) * ball.speed; ball.stuck = false;
}

// ---------- Power-ups (Task 3b) ----------
const DROP_TYPES = {
  wide:   { label: 'W', color: '#3dff8b', dur: 600 },
  slow:   { label: 'S', color: '#00d9ff', dur: 600 },
  sticky: { label: 'K', color: '#ffe14d', dur: 900 },
  life:   { label: '+', color: '#ff2e93', dur: 0 }
};
function maybeDrop(b) {
  if (Math.random() > .22) return;
  const r = Math.random();
  const type = r < .3 ? 'wide' : r < .6 ? 'slow' : r < .9 ? 'sticky' : 'life';
  drops.push({ type, x: b.x + b.w / 2, y: b.y, vy: 2.2 });
}
function applyDrop(type) {
  if (type === 'life') { lives = Math.min(5, lives + 1); return; }
  effects[type] = DROP_TYPES[type].dur;
}

// ---------- Update ----------
function update() {
  // paddle movement
  const sp = 8;
  if (keys['ArrowLeft'] || keys['a']) paddle.x -= sp;
  if (keys['ArrowRight'] || keys['d']) paddle.x += sp;
  paddle.w = effects.wide > 0 ? BASE_PADDLE * 1.6 : BASE_PADDLE;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  for (const k in effects) if (effects[k] > 0) effects[k]--;

  if (ball.stuck) {
    ball.x = paddle.x + (ball.stickOffset ?? paddle.w / 2); ball.y = paddle.y - ball.r - 1;
    if (ball.stickOffset !== undefined) ball.x = Math.max(paddle.x, Math.min(paddle.x + paddle.w, ball.x));
  } else {
    // slow-ball effect scales velocity during movement
    const f = effects.slow > 0 ? .6 : 1;
    ball.x += ball.vx * f; ball.y += ball.vy * f;

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

    // paddle collision
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4) {
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const ang = rel * (Math.PI / 3);
      ball.vx = Math.sin(ang) * ball.speed; ball.vy = -Math.cos(ang) * ball.speed;
      ball.y = paddle.y - ball.r;
      if (effects.sticky > 0) { ball.stuck = true; ball.stickOffset = ball.x - paddle.x; ball.vx = ball.vy = 0; }
    }

    // brick collisions
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
        b.hp--; score += 10 * level;
        for (let i = 0; i < 8; i++) particles.push({ x: ball.x, y: ball.y, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: 22, c: b.color });
        if (b.hp <= 0) maybeDrop(b);
        break;
      }
    }

    // ball lost
    if (ball.y - ball.r > H) {
      lives--; effects = { wide: 0, slow: 0, sticky: 0 }; drops = [];
      if (lives <= 0) return endGame();
      resetBall();
    }
  }

  // falling power-ups
  drops.forEach(d => d.y += d.vy);
  drops = drops.filter(d => {
    if (d.y + 10 >= paddle.y && d.y - 10 <= paddle.y + paddle.h && d.x >= paddle.x && d.x <= paddle.x + paddle.w) {
      applyDrop(d.type); return false;
    }
    return d.y < H + 20;
  });

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // level cleared
  if (bricks.every(b => b.hp <= 0)) { level++; drops = []; buildBricks(); resetBall(); }
}

function endGame() {
  if (qualifies(score)) { state = 'initials'; initials = ''; } else state = 'over';
}

// ---------- Draw ----------
function drawBg() {
  ctx.fillStyle = '#0b0220'; ctx.fillRect(0, 0, W, H);
  // perspective grid
  ctx.strokeStyle = 'rgba(255,46,147,.18)'; ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) { const y = H * .55 + i * i * 3.2; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let i = -10; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 20, H * .55); ctx.lineTo(W / 2 + i * 90, H); ctx.stroke(); }
}
function drawBoard() {
  drawBg();
  bricks.forEach(b => {
    if (b.hp <= 0) return;
    ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
    if (b.hp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); }
  });
  // paddle
  ctx.fillStyle = effects.sticky > 0 ? '#ffe14d' : '#7df9ff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h); ctx.shadowBlur = 0;
  // ball
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  // drops
  drops.forEach(d => {
    const t = DROP_TYPES[d.type];
    ctx.fillStyle = t.color; ctx.shadowColor = t.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.font = '11px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText(t.label, d.x, d.y + 4);
  });
  particles.forEach(p => { ctx.globalAlpha = p.life / 22; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); });
  ctx.globalAlpha = 1;
  // HUD
  ctx.font = '11px "Press Start 2P"'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(`SCORE ${score}`, 14, 28);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe14d'; ctx.fillText(`LEVEL ${level}`, W / 2, 28);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff2e93'; ctx.fillText('♥'.repeat(lives), W - 14, 28);
  // active effects
  ctx.textAlign = 'left'; ctx.font = '8px "Press Start 2P"'; let y = H - 8;
  for (const k in effects) if (effects[k] > 0) { ctx.fillStyle = '#7df9ff'; ctx.fillText(`${k.toUpperCase()} ${(effects[k] / 60).toFixed(0)}s`, 10, y); y -= 12; }
  if (ball.stuck && state === 'play') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '10px "Press Start 2P"';
    ctx.fillText('SPACE / CLICK TO LAUNCH', W / 2, H - 70);
  }
}
function drawLB(y) {
  const lb = loadLB();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe14d'; ctx.font = '12px "Press Start 2P"'; ctx.fillText('TOP 5', W / 2, y);
  ctx.font = '10px "Press Start 2P"';
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = '#fff';
    const e = lb[i];
    ctx.fillText(`${i + 1}. ${e ? e.name.padEnd(3, ' ') + '  ' + String(e.score).padStart(6, ' ') : '---   ------'}`, W / 2, y + 26 + i * 22);
  }
}
function overlay(title, color) {
  ctx.fillStyle = 'rgba(5,0,20,.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.font = '30px "Press Start 2P"'; ctx.fillText(title, W / 2, 120); ctx.shadowBlur = 0;
}
function draw() {
  if (state === 'start') {
    drawBg(); overlay('BREAKOUT', '#ff2e93');
    ctx.font = '10px "Press Start 2P"'; ctx.fillStyle = '#7df9ff';
    ctx.fillText('W wide  S slow  K sticky  + life', W / 2, 165);
    drawLB(215);
    ctx.fillStyle = '#fff'; ctx.font = '12px "Press Start 2P"'; ctx.fillText('CLICK or ENTER to start', W / 2, 410);
    ctx.fillStyle = '#ffe14d'; ctx.font = '9px "Press Start 2P"'; ctx.fillText('by Anthony Bayate', W / 2, 470);
    return;
  }
  drawBoard();
  if (state === 'paused') { overlay('PAUSED', '#ffe14d'); ctx.font = '11px "Press Start 2P"'; ctx.fillStyle = '#fff'; ctx.fillText('Press P to resume', W / 2, 180); }
  if (state === 'over') { overlay('GAME OVER', '#ff2e93'); ctx.font = '14px "Press Start 2P"'; ctx.fillStyle = '#fff'; ctx.fillText(`SCORE ${score}`, W / 2, 170); drawLB(225); ctx.font = '11px "Press Start 2P"'; ctx.fillText('CLICK or ENTER to play again', W / 2, 420); }
  if (state === 'initials') {
    overlay('NEW HIGH SCORE!', '#3dff8b');
    ctx.font = '14px "Press Start 2P"'; ctx.fillStyle = '#fff'; ctx.fillText(`SCORE ${score}`, W / 2, 170);
    ctx.font = '11px "Press Start 2P"'; ctx.fillText('Type your initials (3 letters), then ENTER', W / 2, 230);
    ctx.font = '36px "Press Start 2P"'; ctx.fillStyle = '#ffe14d';
    ctx.fillText((initials + '___').slice(0, 3).split('').join(' '), W / 2, 310);
  }
}

// ---------- Loop & input ----------
function loop() { if (state === 'play') update(); draw(); requestAnimationFrame(loop); }

window.addEventListener('keydown', e => {
  if (state === 'initials') {
    if (/^[a-zA-Z]$/.test(e.key) && initials.length < 3) initials += e.key.toUpperCase();
    else if (e.key === 'Backspace') initials = initials.slice(0, -1);
    else if (e.key === 'Enter' && initials.length > 0) { addLB(initials.padEnd(3, '-'), score); state = 'over'; }
    e.preventDefault(); return;
  }
  keys[e.key] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play';
  }
  if (e.key === ' ' && state === 'play') launch();
  if (e.key === 'Enter' && (state === 'start' || state === 'over')) newGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  if (state !== 'play') return;
  const r = canvas.getBoundingClientRect();
  paddle.x = (e.clientX - r.left) * (W / r.width) - paddle.w / 2;
});
canvas.addEventListener('click', () => {
  if (state === 'start' || state === 'over') newGame();
  else if (state === 'play') launch();
});

// background state so first frame has something to draw
level = 1; buildBricks(); paddle = { w: BASE_PADDLE, h: 14, x: W / 2 - BASE_PADDLE / 2, y: H - 36 };
effects = { wide: 0, slow: 0, sticky: 0 }; drops = []; particles = []; score = 0; lives = 3; resetBall();
requestAnimationFrame(loop);
</script>
</body>
</html>
